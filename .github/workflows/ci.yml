name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Byte-compile the package
        run: python -m compileall -q hoshyar tests

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Check the frontend for syntax errors
        run: node --check frontend/app.js

      - name: Check for trailing whitespace and conflict markers
        run: |
          git diff --check HEAD
          ! git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ':!outputs'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t hoshyar:ci .

      - name: Start the container
        run: |
          docker run -d --name hoshyar-ci \
            -e HOSHYAR_BOOTSTRAP_KEY=ci-bootstrap-key-not-a-secret \
            -p 8000:8000 hoshyar:ci

      - name: Wait for health and exercise the API
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status": "ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="connection-form"'
          created=$(curl -fsS -X POST http://127.0.0.1:8000/v1/tenants \
            -H "X-Bootstrap-Key: ci-bootstrap-key-not-a-secret" \
            -H 'Content-Type: application/json' -d '{"name":"دفتر آزمایشی"}')
          echo "$created" | grep -q '"api_key"'
          docker exec hoshyar-ci test -f /data/hoshyar.sqlite3

      - name: Verify the container runs unprivileged
        run: docker exec hoshyar-ci id -u | grep -q '^10001$'

      - name: Show logs on failure
        if: failure()
        run: docker logs hoshyar-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f hoshyar-ci || true

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: hoshyar-sbom.cdx.json
